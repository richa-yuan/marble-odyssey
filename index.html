<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>滚珠奇旅 · Marble Odyssey</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%23bfe3ff'/%3E%3Cstop offset='55%25' stop-color='%234aa8ff'/%3E%3Cstop offset='100%25' stop-color='%231a3a8f'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ccircle cx='42' cy='20' r='7' fill='%23ffffff' opacity='0.7'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <script>
      // 轻量错误收集(调试用)
      window.__errors = []
      window.addEventListener('error', e => window.__errors.push(e.message + ' @ ' + (e.filename || '') + ':' + e.lineno))
      window.addEventListener('unhandledrejection', e => window.__errors.push('REJECTION: ' + String((e.reason && e.reason.stack) || e.reason)))
    </script>
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-top-left">
        <div id="hud-level-name"></div>
        <div id="hud-gems"><span class="gem-icon">💎</span><span id="gem-count">0/0</span></div>
      </div>
      <div id="hud-top-right">
        <div id="hud-timer">00:00.0</div>
        <button id="btn-mute" class="hud-btn" title="静音 (M)">🔊</button>
      </div>
      <div id="hud-bottom">
        <span class="key-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 滚动</span>
        <span class="key-hint"><kbd>Space</kbd> 跳跃</span>
        <span class="key-hint"><kbd>Q</kbd><kbd>E</kbd>/拖动 转视角</span>
        <span class="key-hint"><kbd>R</kbd> 回到检查点</span>
      </div>
      <div id="toast"></div>
      <div id="vignette"></div>
      <!-- mobile controls -->
      <div id="touch-ui" class="hidden">
        <div id="joystick"><div id="joystick-knob"></div></div>
        <div id="touch-right">
          <div id="btn-respawn-touch">↺</div>
          <div id="btn-jump">⤒</div>
        </div>
      </div>
    </div>

    <!-- 主菜单 -->
    <div id="menu" class="overlay">
      <div class="menu-inner">
        <h1 class="game-title"><span class="cn">滚珠奇旅</span><span class="en">MARBLE&nbsp;ODYSSEY</span></h1>
        <p class="tagline">一颗滚珠 · 五个世界 · 收集宝石抵达传送门</p>
        <div id="level-grid"></div>
        <div class="menu-foot">
          <button id="btn-start" class="btn primary">▶ 开始游戏</button>
          <div class="controls-note">
            <span>WASD / 方向键 滚动</span><span>Space 跳跃</span><span>Q / E 或拖动 旋转视角</span><span>R 重置到检查点</span><span>Esc 暂停</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 暂停菜单 -->
    <div id="pause" class="overlay hidden">
      <div class="panel">
        <h2>⏸ 暂停</h2>
        <button id="btn-resume" class="btn primary">继续</button>
        <button id="btn-restart" class="btn">重玩本关</button>
        <button id="btn-to-menu" class="btn">返回选关</button>
      </div>
    </div>

    <!-- 通关 -->
    <div id="win" class="overlay hidden">
      <div class="panel">
        <h2 id="win-title">🌟 关卡完成!</h2>
        <div class="win-stats">
          <div><label>用时</label><span id="win-time">--</span></div>
          <div><label>宝石</label><span id="win-gems">--</span></div>
          <div><label>最佳</label><span id="win-best">--</span></div>
        </div>
        <button id="btn-next" class="btn primary">下一关 →</button>
        <button id="btn-win-retry" class="btn">再跑一次</button>
        <button id="btn-win-menu" class="btn">返回选关</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
